[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.143.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jsonschema>=4.26.0",
    "livekit-api>=1.2.1",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
