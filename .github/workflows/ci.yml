name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd backend && uv sync && uv run ruff check . && uv run mypy app && uv run pytest -q
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: cd agent && uv sync && uv run ruff check . && uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('frontend/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm run lint && npm run typecheck && npm test -- --run && npm run build
  images:
    runs-on: ubuntu-latest
    needs: [backend, agent]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/backend.Dockerfile .
      - run: docker build -f infra/docker/agent.Dockerfile .
